[project]
name = "finance-tracker"
version = "1.0.0"
description = "Options trading analyzer for Fidelity CSV exports"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.17",
    "jinja2==3.1.4",
    "bokeh==3.6.2",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "pandas==2.2.3",
    "httpx==0.28.1",
    "pydantic-settings==2.6.1",
    "python-dotenv==1.0.1",
    "playwright==1.49.1",
    "scipy==1.14.1",
    "yfinance==0.2.49",
    "requests",
    "alembic==1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "mypy==1.13.0",
    "types-requests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
# Pragmatic config: catch the worst stuff without forcing a full type
# annotation pass on a hot-evolving codebase.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Annotate gradually — don't fail just because something isn't typed yet.
disallow_untyped_defs = false
# These libs don't ship stubs.
[[tool.mypy.overrides]]
module = [
    "yfinance",
    "playwright.*",
    "bokeh.*",
    "scipy.*",
    "pandas.*",
    "aiosqlite.*",
    "alembic.*",
]
ignore_missing_imports = true
follow_imports = "skip"  # avoid attr-defined noise from third-party libs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
