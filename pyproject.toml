[project]
name = "finance-tracker"
version = "1.0.0"
description = "Options trading analyzer for Fidelity CSV exports"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "bokeh==3.10.0",
    "sqlalchemy[asyncio]==2.0.54",  # [asyncio] pulls greenlet, which the async engine needs
    "aiosqlite==0.22.1",
    "pandas==3.0.6",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "scipy==1.18.1",
    "yfinance==1.7.0",
    "alembic==1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "mypy==2.3.1",
    "httpx2==2.13.1",  # starlette>=1 TestClient transport; httpx there is deprecated
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --tb=short -m 'not live'"
filterwarnings = ["ignore::DeprecationWarning"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live: requires network, valid Stocknear cookies, and a subscription (deselected by default)",
]

[tool.mypy]
python_version = "3.13"
# Pragmatic config: catch the worst stuff without forcing a full type
# annotation pass on a hot-evolving codebase.
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
# Annotate gradually — don't fail just because something isn't typed yet.
disallow_untyped_defs = false
# These libs don't ship stubs.
[[tool.mypy.overrides]]
module = [
    "yfinance",
    "bokeh.*",
    "scipy.*",
    "pandas.*",
    "aiosqlite.*",
    "alembic.*",
]
ignore_missing_imports = true
follow_imports = "skip"  # avoid attr-defined noise from third-party libs

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
