<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Options Trading Analyzer{% endblock %}</title>
    <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.6.2.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            line-height: 1.6;
        }

        nav {
            background-color: #1e1e1e;
            padding: 1rem 2rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .logo {
            font-size: 1.25rem;
            font-weight: 600;
            color: #22c55e;
        }

        nav .nav-links {
            display: flex;
            gap: 1.5rem;
        }

        nav a {
            color: #b0b0b0;
            text-decoration: none;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active {
            color: #22c55e;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            color: #fff;
        }

        h2 {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #e0e0e0;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 1.25rem;
            border: 1px solid #333;
        }

        .stat-card .label {
            font-size: 0.875rem;
            color: #888;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .stat-card .value.positive {
            color: #22c55e;
        }

        .stat-card .value.negative {
            color: #ef4444;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .chart-container {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #333;
        }

        .chart-container.full-width {
            grid-column: 1 / -1;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #252525;
            font-weight: 600;
            color: #e0e0e0;
        }

        tr:hover {
            background-color: #252525;
        }

        .tag {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .tag.winner {
            background-color: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .tag.loser {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .tag.open {
            background-color: rgba(59, 130, 246, 0.2);
            color: #3b82f6;
        }

        .tag.expired {
            background-color: rgba(168, 85, 247, 0.2);
            color: #a855f7;
        }

        .tag.assigned {
            background-color: rgba(249, 115, 22, 0.2);
            color: #f97316;
        }

        .tag.closed {
            background-color: rgba(107, 114, 128, 0.2);
            color: #9ca3af;
        }

        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: background-color 0.2s;
        }

        .btn-primary {
            background-color: #22c55e;
            color: #000;
        }

        .btn-primary:hover {
            background-color: #16a34a;
        }

        .btn-secondary {
            background-color: #333;
            color: #e0e0e0;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .form-group input[type="file"] {
            width: 100%;
            padding: 0.75rem;
            background-color: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            color: #e0e0e0;
        }

        .alert {
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background-color: rgba(34, 197, 94, 0.2);
            border: 1px solid #22c55e;
            color: #22c55e;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #ef4444;
        }

        .filter-bar {
            margin-bottom: 1rem;
            display: flex;
            gap: 0.5rem;
        }

        .money {
            font-variant-numeric: tabular-nums;
        }

        .money.positive {
            color: #22c55e;
        }

        .money.negative {
            color: #ef4444;
        }

        .value.warning {
            color: #f59e0b;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <div class="logo">Options Analyzer</div>
        <div class="nav-links">
            <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
            <a href="/positions" class="{% if request.url.path == '/positions' %}active{% endif %}">Positions</a>
            <a href="/cycles" class="{% if request.url.path == '/cycles' %}active{% endif %}">Wheel Cycles</a>
            <a href="/risk" class="{% if request.url.path == '/risk' %}active{% endif %}">Risk Analysis</a>
            <a href="/speculation" class="{% if request.url.path == '/speculation' %}active{% endif %}">Speculation</a>
            <a href="/import" class="{% if request.url.path == '/import' %}active{% endif %}">Import</a>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
